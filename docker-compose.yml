version: '3.4'

x-app-service-template: &app
  build: rails_app
  image: yabeda-rails-app:1.0
  volumes:
    - ./rails_app:/app
  environment: &app-environment
    REDIS_URL: redis://redis:6379/0
    RAILS_HOST: ${RAILS_HOST:-rails}

services:
  rails:
    <<: *app
    ports:
      - ${RAILS_PORT:-5000}:5000
    stdin_open: true
    tty: true
    depends_on:
      - redis

    command: bundle exec puma -C config/puma.rb

  sidekiq:
    <<: *app
    ports:
      - 5100:5100
    environment:
      <<: *app-environment
      PORT: 5100
    depends_on:
      - redis

    command: sidekiq -C config/sidekiq.yml

  redis:
    image: redis
    command: redis-server

  grafana:
    image: grafana/grafana:10.2.2
    depends_on:
      - prometheus
    ports:
      - 3000:3000/tcp
    volumes: 
      - ./grafana_db:/var/lib/grafana
    user: "0"

  prometheus:
    image: prom/prometheus:v2.48.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - 9090:9090/tcp
    depends_on:
      - rails
    command:
      - --config.file=/etc/prometheus/prometheus.yml

  rails_stressor:
    build: rails_stressor
    image: rails_stressor
    depends_on:
      - rails
    entrypoint:
      - /bin/bash
      - -c
      - 'until ( : > /dev/tcp/rails/5000 ) 2>/dev/null; do sleep 1; done; exec hey "$@"'
      - --
    command: -z 2m -c 15 -m GET http://rails:5000
